name: Deploy Marketing Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://alphagen-api.azurewebsites.net
          VITE_EMPLOYEE_PORTAL_URL: https://alphagenemployee.z21.web.core.windows.net/

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Blob Static Website
        run: |
          az storage blob upload-batch \
            --account-name alphagenstore \
            --source dist/ \
            --destination '$web' \
            --overwrite \
            --auth-mode login

      - name: Purge CDN cache (if applicable)
        run: echo "Static site deployed to https://alphagenstore.z21.web.core.windows.net/"

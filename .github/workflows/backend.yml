name: Deploy Backend (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - 'alphagensolutions-website/backend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alphagensolutions-website/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: alphagensolutions-website/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create deployment package
        working-directory: ${{ github.workspace }}
        run: |
          cd alphagensolutions-website/backend
          zip -r ${{ github.workspace }}/backend-deploy.zip . \
            --exclude "*.git*" \
            --exclude "*test*" \
            --exclude "*.env*"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Function App
        run: |
          az functionapp deployment source config-zip \
            -g alphagen-rg \
            -n alphagen-api \
            --src ${{ github.workspace }}/backend-deploy.zip

      - name: Print URL
        run: echo "Backend deployed to https://alphagen-api.azurewebsites.net"

# Deploy backend → Azure Functions (alphagen-api)
# Required:
#   - service connection "AlphaGen-Azure" in Project Settings → Service connections
#   - Set WEBSITE_RUN_FROM_PACKAGE=1 on the Function App (already configured)
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - alphagensolutions-website/backend/**

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'AlphaGen-Azure'
  functionAppName: 'alphagen-api'
  resourceGroup: 'alphagen-rg'
  workDir: '$(System.DefaultWorkingDirectory)/alphagensolutions-website/backend'

steps:
  - task: NodeTool@0
    displayName: 'Use Node 20'
    inputs:
      versionSpec: '20.x'

  - script: npm ci --omit=dev
    workingDirectory: $(workDir)
    displayName: 'Install production dependencies'

  # Archive backend excluding local-only files
  - task: ArchiveFiles@2
    displayName: 'Create deployment zip'
    inputs:
      rootFolderOrFile: $(workDir)
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
      replaceExistingArchive: true
      exclude: |
        server.js
        .env
        .env.*
        node_modules/.cache/**

  - task: AzureFunctionApp@2
    displayName: 'Deploy to Azure Functions'
    inputs:
      azureSubscription: $(azureServiceConnection)
      appType: functionAppLinux
      appName: $(functionAppName)
      package: '$(Build.ArtifactStagingDirectory)/backend.zip'
      deploymentMethod: zipDeploy

# Deploy supervisor portal → alphagensupervisor/$web
# Required:
#   - service connection "AlphaGen-Azure" in Project Settings → Service connections
#   - storage account "alphagensupervisor" with static website enabled:
#       az storage account create -n alphagensupervisor -g alphagen-rg -l southcentralus --sku Standard_LRS
#       az storage blob service-properties update --account-name alphagensupervisor --static-website --index-document index.html --404-document index.html
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - alphagensolutions-website/supervisor-portal/**

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'AlphaGen-Azure'
  storageAccount: 'alphagensupervisor'
  workDir: '$(System.DefaultWorkingDirectory)/alphagensolutions-website/supervisor-portal'

steps:
  - task: NodeTool@0
    displayName: 'Use Node 20'
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    workingDirectory: $(workDir)
    displayName: 'Install dependencies'

  - script: npm run build
    workingDirectory: $(workDir)
    displayName: 'Build'

  - task: AzureCLI@2
    displayName: 'Upload dist/ → $web'
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az storage blob upload-batch \
          --account-name $(storageAccount) \
          --destination '$web' \
          --source '$(workDir)/dist' \
          --overwrite

        # Print the static website URL after deploy
        az storage account show \
          --name $(storageAccount) \
          --query "primaryEndpoints.web" \
          --output tsv

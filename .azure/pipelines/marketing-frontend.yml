# Deploy marketing site → alphagenstore/$web
# Required: service connection named "AlphaGen-Azure" in Project Settings → Service connections
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - alphagensolutions-website/frontend/**

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'AlphaGen-Azure'
  storageAccount: 'alphagenstore'
  workDir: '$(System.DefaultWorkingDirectory)/alphagensolutions-website/frontend'

steps:
  - task: NodeTool@0
    displayName: 'Use Node 20'
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    workingDirectory: $(workDir)
    displayName: 'Install dependencies'

  - script: npm run build
    workingDirectory: $(workDir)
    displayName: 'Build'

  - task: AzureCLI@2
    displayName: 'Upload dist/ → $web'
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az storage blob upload-batch \
          --account-name $(storageAccount) \
          --destination '$web' \
          --source '$(workDir)/dist' \
          --overwrite

# Local development stack: MongoDB + backend API + marketing frontend
# Usage: docker compose up          (add --profile portals for both portals)
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/alphagen
      PORT: "5000"
      NODE_ENV: development
      FRONTEND_URLS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      JWT_SECRET: local_dev_only_jwt_secret_change_me_32chars
      JWT_REFRESH_SECRET: local_dev_only_refresh_secret_change_me
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  employee-portal:
    profiles: [portals]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    volumes:
      - ./employee-portal:/app
      - employee-node-modules:/app/node_modules
    depends_on:
      - backend

  supervisor-portal:
    profiles: [portals]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5175"
    ports:
      - "5175:5175"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    volumes:
      - ./supervisor-portal:/app
      - supervisor-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-node-modules:
  frontend-node-modules:
  employee-node-modules:
  supervisor-node-modules:
